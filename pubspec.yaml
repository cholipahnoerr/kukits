name: kukits
description: "Aplikasi penjualan kukusan dengan tracker nutrisi dan scan kalori AI."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0

  # Storage
  supabase_flutter: ^2.9.0

  # State Management
  flutter_bloc: ^8.1.5
  bloc_concurrency: ^0.2.5
  equatable: ^2.0.5

  # Navigation
  go_router: ^14.0.0

  # HTTP & AI
  dio: ^5.4.3
  http: ^1.2.1

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Image
  image_picker: ^1.1.1
  cached_network_image: ^3.3.1

  # Notifications
  flutter_local_notifications: ^17.2.1
  timezone: ^0.9.4

  # UI
  flutter_svg: ^2.0.10
  shimmer: ^3.0.0
  fl_chart: ^0.68.0
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1

  # Utils
  intl: ^0.19.0
  uuid: ^4.4.0
  google_sign_in: ^6.2.1
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.9
  hive_generator: ^2.0.1
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/